<!DOCTYPE html>
<html>
<head>
    <title>Vocabulary Builder</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        section {
            text-align: center;
            padding: 30px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        .word {
            background: white;
            width: 500px;
            max-width: 80%;
            margin: 20px auto;
            padding: 15px;
            text-align: left;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function App() {

    const [search, setSearch] = React.useState("");

    const words = [
        {
            word: "Happy",
            meaning: "Feeling pleasure and joy.",
            example: "She is happy today."
        },
        {
            word: "Brave",
            meaning: "Ready to face danger.",
            example: "The brave boy helped others."
        },
        {
            word: "Beautiful",
            meaning: "Very attractive or pleasing.",
            example: "The flower is beautiful."
        },
        {
            word: "Important",
            meaning: "Having great value.",
            example: "Education is important."
        }
    ];

    const filteredWords = words.filter(function(item) {
        return item.word.toLowerCase().includes(search.toLowerCase());
    });

    return (
        <div>

            <header>
                <h1>Vocabulary Builder</h1>
                <p>Improve Your English Vocabulary</p>
            </header>

            <nav>
                <a href="#home">Home</a>
                <a href="#words">Words</a>
                <a href="#about">About</a>
            </nav>

            <section id="home">
                <h2>Welcome to Vocabulary Builder</h2>
                <p>
                    Learn new English words with their meanings
                    and examples.
                </p>
            </section>

            <section id="words">
                <h2>Vocabulary Words</h2>

                <input
                    type="text"
                    placeholder="Search a word"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                />

                {filteredWords.map(function(item, index) {

                    return (
                        <div className="word" key={index}>

                            <h3>{item.word}</h3>

                            <p>
                                <b>Meaning:</b> {item.meaning}
                            </p>

                            <p>
                                <b>Example:</b> {item.example}
                            </p>

                        </div>
                    );

                })}

            </section>

            <section id="about">
                <h2>About</h2>

                <p>
                    Vocabulary Builder is a React Single Page
                    Application for learning English vocabulary.
                </p>

            </section>

            <footer>
                <p>© 2026 Vocabulary Builder</p>
            </footer>

        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
